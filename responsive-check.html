<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive QA</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:24px;background:#222;color:#fff;font:14px system-ui,sans-serif}.devices{display:flex;align-items:flex-start;gap:24px;min-width:1240px}.device{flex:none}.device h2{margin:0 0 10px;font-size:14px;font-weight:500}.phone{width:390px}.tablet{width:768px}.desktop{width:1280px;margin-top:24px}iframe{display:block;width:100%;height:844px;border:1px solid #666;background:#fff}.tablet iframe{height:1024px}.desktop iframe{height:800px}
  </style>
</head>
<body>
  <div class="devices">
    <section class="device phone"><h2>Phone · 390px</h2><iframe src="index.html?qa=phone" title="Phone preview"></iframe></section>
    <section class="device tablet"><h2>iPad portrait · 768px</h2><iframe src="index.html?qa=ipad" title="iPad preview"></iframe></section>
  </div>
  <section class="device desktop"><h2>Computer · 1280px</h2><iframe src="index.html?qa=desktop" title="Desktop preview"></iframe></section>
</body>
</html>
